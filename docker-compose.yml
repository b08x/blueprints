services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blueprints:latest # You can change this to your desired image name
    container_name: blueprints-web
    command: ./bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    environment:
      - RAILS_ENV=development # Or production if you are ready
      - DATABASE_URL=postgres://postgres:password@db:5432/blueprints_development # Adjust database parameters
      # Add other environment variables if needed (e.g., REDIS_URL, etc.)
    depends_on:
      - db
    volumes:
      - .:/rails # Mounts your current directory into the /rails directory inside the container
      - bundle_cache:/usr/local/bundle
      - rails_storage:/rails/storage # Persists the storage folder
    networks:
      - blueprints
  db:
    image: postgres:14-alpine
    container_name: blueprints-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password # Change this to a strong password in production
      - POSTGRES_DB=blueprints_development # Or myapp_production if you are in production
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - blueprints
  redis_service:
    image: redis/redis-stack:latest
    container_name: blueprints-redis
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
    volumes:
      - redis_cache:/data
    ports:
      - "6379:6379"
      - "8081:8081"
      - "8001:8001"
    networks:
      - blueprints
  chroma_service:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: blueprints-chromadb
    restart: unless-stopped
    volumes:
      - chromadb_storage:/chroma/chroma/
    environment:
      PUID: 1000
      PGID: 1000
      IS_PERSISTENT: TRUE
    ports:
      - "8020:8000"
    networks:
      - blueprints

volumes:
  bundle_cache:
  db_data:
  rails_storage:
  redis_cache:
  chromadb_storage:

networks:
  flowbots:
    driver: bridge