services:
  nginx:
    image: nginx:latest
    container_name: blueprints-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - web
    networks:
      - blueprints
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: blueprints:latest
    container_name: blueprints-web
    command: ./bin/rails server -b 0.0.0.0
    # Port 3000 is now only exposed to the internal network, not to the host
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgresql://postgres:blueprints@pgvector:5432/blueprints_development
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - pgvector
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - rails_storage:/rails/storage
    networks:
      - blueprints
  pgvector:
    image: ankane/pgvector
    container_name: blueprints-pgvector
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=blueprints
      - POSTGRES_DB=blueprints_development
    ports:
      - "5432:5432"
    volumes:
      - postgresql_local_data:/data
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - blueprints

volumes:
  bundle_cache:
    driver: local
  postgresql_data:
    driver: local
  postgresql_local_data:
    driver: local
  rails_storage:
    driver: local

networks:
  blueprints:
    driver: bridge